name: AI Video Generator - The Shortest Orbit

on:
  schedule:
    # 3 Peak Daily Upload Slots Aligned strictly with YouTube Analytics Viewer Heatmap (GMT+0530 / IST):
    - cron: "30 20 * * *"  # Slot 1: 02:00 AM IST / 20:30 UTC (Heatmap Peak Window — 02:00 AM–05:00 AM IST)
    - cron: "30 22 * * *"  # Slot 2: 04:00 AM IST / 22:30 UTC (Heatmap Peak Window — 02:00 AM–05:00 AM IST)
    - cron: "0 16 * * *"   # Slot 3: 09:30 PM IST / 16:00 UTC (Evening Active Window — 09:00 PM–11:00 PM IST)
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Fix ImageMagick Security Policy for MoviePy
        run: |
          # MoviePy requires ImageMagick to have read/write access to paths
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruct Environment (.env)
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "META_APP_ID=${{ secrets.META_APP_ID }}" >> .env
          echo "META_APP_SECRET=${{ secrets.META_APP_SECRET }}" >> .env
          echo "META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}" >> .env
          echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> .env
          echo "INSTAGRAM_BUSINESS_ACCOUNT_ID=${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}" >> .env
          echo "ENABLE_META_AI_DUBBING=True" >> .env

      - name: Reconstruct YouTube Credentials
        run: |
          # Decode the base64 secrets back into files
          echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 --decode > token.pickle
          echo "${{ secrets.CLIENT_SECRET_BASE64 }}" | base64 --decode > client_secret.json

      - name: Run Pipeline
        run: |
          python python/main.py

      - name: Harvest Analytics
        if: always()
        run: |
          python python/harvest_analytics.py || echo "Analytics harvest skipped"

      - name: Commit and Push Database Updates
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only add database and logs if they exist and changed
          git add data/shortest_orbit_v3.db || true
          git add -f logs/pipeline.log || true
          git commit -m "Automated: Sync SQLite database and logs from cloud execution [skip ci]" || echo "No updates to commit"
          git push origin HEAD:main || echo "Failed to push updates"
