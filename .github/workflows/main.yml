name: AI Video Generator - The Shortest Orbit

on:
  schedule:
    # GitHub Actions runs on UTC time. Your timezone is IST (UTC +5:30).
    # These have been perfectly converted so they run at your exact local times:
    - cron: "30 3 * * *"   # Runs at 9:00 AM IST
    - cron: "30 7 * * *"   # Runs at 1:00 PM IST
    - cron: "30 11 * * *"  # Runs at 5:00 PM IST
    - cron: "0 14 * * *"   # Runs at 7:30 PM IST
    - cron: "0 16 * * *"   # Runs at 9:30 PM IST
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Fix ImageMagick Security Policy for MoviePy
        run: |
          # MoviePy requires ImageMagick to have read/write access to paths
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruct Environment (.env)
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Reconstruct YouTube Credentials
        run: |
          # Decode the base64 secrets back into files
          echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 --decode > token.pickle
          echo "${{ secrets.CLIENT_SECRET_BASE64 }}" | base64 --decode > client_secret.json

      - name: Run Pipeline
        run: |
          python python/main.py
