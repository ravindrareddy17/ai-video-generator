name: AI Video Generator - The Shortest Orbit

on:
  schedule:
    # Optimized for global prime-time hours (US EST, UK/Europe BST, and Asia IST):
    - cron: "0 11 * * *"   # Runs at 7:00 AM EST  / 12:00 PM BST / 4:30 PM IST  (Morning commute peak)
    - cron: "0 15 * * *"   # Runs at 11:00 AM EST / 4:00 PM BST  / 8:30 PM IST  (US lunch & European afternoon)
    - cron: "30 18 * * *"  # Runs at 2:30 PM EST  / 7:30 PM BST  / 12:00 AM IST (US afternoon & European prime-time)
    - cron: "0 22 * * *"   # Runs at 6:00 PM EST  / 11:00 PM BST / 3:30 AM IST  (US evening peak)
    - cron: "30 1 * * *"   # Runs at 9:30 PM EST  / 2:30 AM BST  / 7:00 AM IST  (US late night & Asian morning)
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Fix ImageMagick Security Policy for MoviePy
        run: |
          # MoviePy requires ImageMagick to have read/write access to paths
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruct Environment (.env)
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "PIXABAY_API_KEY=${{ secrets.PIXABAY_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Reconstruct YouTube Credentials
        run: |
          # Decode the base64 secrets back into files
          echo "${{ secrets.TOKEN_PICKLE_BASE64 }}" | base64 --decode > token.pickle
          echo "${{ secrets.CLIENT_SECRET_BASE64 }}" | base64 --decode > client_secret.json

      - name: Run Pipeline
        run: |
          python python/main.py

      - name: Commit and Push Database Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only add database and logs if they exist and changed
          git add data/shortest_orbit_v3.db logs/pipeline.log || true
          git commit -m "Automated: Sync SQLite database and logs from cloud execution [skip ci]" || echo "No updates to commit"
          git push origin HEAD:main || echo "Failed to push updates"
